<div class="inventory-list-container">
  <div *ngIf="!vehicles || vehicles.length === 0" class="empty-state">
    <mat-icon>inventory_2</mat-icon>
    <p>No vehicles found</p>
  </div>

  <div *ngIf="vehicles && vehicles.length > 0" class="table-container">
    <table mat-table [dataSource]="dataSource" matSort class="inventory-table">
      <!-- VIN Column -->
      <ng-container matColumnDef="vin">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>VIN</th>
        <td mat-cell *matCellDef="let vehicle" [ngClass]="getRowClass(vehicle)">
          {{ vehicle.vin }}
        </td>
      </ng-container>

      <!-- Make Column -->
      <ng-container matColumnDef="make">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Make</th>
        <td mat-cell *matCellDef="let vehicle" [ngClass]="getRowClass(vehicle)">
          {{ vehicle.make }}
        </td>
      </ng-container>

      <!-- Model Column -->
      <ng-container matColumnDef="model">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Model</th>
        <td mat-cell *matCellDef="let vehicle" [ngClass]="getRowClass(vehicle)">
          {{ vehicle.model }}
        </td>
      </ng-container>

      <!-- Year Column -->
      <ng-container matColumnDef="year">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Year</th>
        <td mat-cell *matCellDef="let vehicle" [ngClass]="getRowClass(vehicle)">
          {{ vehicle.year }}
        </td>
      </ng-container>

      <!-- Days in Stock Column -->
      <ng-container matColumnDef="daysInStock">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Days in Stock</th>
        <td mat-cell *matCellDef="let vehicle" [ngClass]="getRowClass(vehicle)">
          <span class="days-badge" [class.aging]="isAging(vehicle)" [class.warning]="isWarning(vehicle)">
            {{ vehicle.daysInStock }} days
          </span>
        </td>
      </ng-container>

      <!-- Price Column -->
      <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Price</th>
        <td mat-cell *matCellDef="let vehicle" [ngClass]="getRowClass(vehicle)">
          {{ formatPrice(vehicle.price) }}
        </td>
      </ng-container>

      <!-- Status Column -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
        <td mat-cell *matCellDef="let vehicle" [ngClass]="getRowClass(vehicle)">
          <mat-chip [class]="'status-' + vehicle.status">
            {{ vehicle.status | titlecase }}
          </mat-chip>
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let vehicle" [ngClass]="getRowClass(vehicle)">
          <button
            mat-raised-button
            color="primary"
            (click)="openActionDialog(vehicle)"
            [disabled]="!isAging(vehicle)"
            [matTooltip]="isAging(vehicle) ? 'Log action for aging vehicle' : 'Only available for aging stock (>90 days)'">
            <mat-icon>assignment</mat-icon>
            Log Action
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator
      [pageSizeOptions]="[25, 50, 100]"
      showFirstLastButtons
      aria-label="Select page of vehicles">
    </mat-paginator>
  </div>
</div>
