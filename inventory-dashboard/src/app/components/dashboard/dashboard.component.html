<div class="dashboard-container">
  <header class="dashboard-header">
    <h1>Intelligent Inventory Dashboard</h1>
    <p class="subtitle">Real-time vehicle stock management</p>
  </header>

  <div *ngIf="isLoading" class="loading-container">
    <mat-spinner></mat-spinner>
    <p>Loading inventory...</p>
  </div>

  <div *ngIf="error" class="error-container">
    <mat-card class="error-card">
      <mat-card-content>
        <h2>Error</h2>
        <p>{{ error }}</p>
        <p class="error-hint">Make sure to run: <code>npm run json-server</code></p>
      </mat-card-content>
    </mat-card>
  </div>

  <div *ngIf="!isLoading && !error" class="dashboard-content">
    <!-- Aging Stock Alert -->
    <app-aging-stock-alert
      [agingVehicles]="agingStock$ | async"
      class="alert-section">
    </app-aging-stock-alert>

    <!-- Filter Panel -->
    <app-filter-panel
      [vehicles]="vehicles$ | async"
      (filterChange)="onFilterChange($event)"
      class="filter-section">
    </app-filter-panel>

    <!-- Inventory Tabs -->
    <mat-tab-group class="inventory-tabs">
      <mat-tab label="All Inventory">
        <app-inventory-list
          [vehicles]="filteredVehicles$ | async"
          (vehicleAction)="onVehicleAction($event)">
        </app-inventory-list>
      </mat-tab>

      <mat-tab label="Aging Stock Only">
        <app-inventory-list
          [vehicles]="agingStock$ | async"
          [highlightAging]="false"
          (vehicleAction)="onVehicleAction($event)">
        </app-inventory-list>
      </mat-tab>
    </mat-tab-group>
  </div>
</div>
